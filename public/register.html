<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>注册新账号</title>
<!--
  自助注册页。放在 public/ 下是因为 Chainlit 的 SPA 兜底路由
  (GET /{full_path:path}) 会吃掉其它 GET 路径，只有 /public/* 是它之前注册的。
  由 @router.get("/public/{filename:path}") 原样提供，不需要鉴权（注册本来就是
  未登录的人在用）。

  页面文字是中文：这个应用其它面向用户的文案（chainlit.md、HELP_TEXT）也都是中文，
  而 Chainlit 自带登录页跟随浏览器语言。要分享给英文用户就改这一个文件。
-->
<style>
  /* Chainlit 的样式表文件名带构建哈希（index-<hash>.css），静态页没法稳定引用，
     所以这里复刻它的主题变量。值抄自 dist 里的 :root / .dark，别试图去重。
     注意：如果将来在 .chainlit/config.toml 的 [UI.theme] 里自定义了配色，
     这个页面不会跟着变。 */
  :root {
    --background: 0 0% 100%;
    --foreground: 0 0% 5%;
    --primary: 340 92% 52%;
    --primary-foreground: 0 0% 100%;
    --muted-foreground: 0 0% 36%;
    --input: 0 0% 90%;
    --ring: 340 92% 52%;
    --radius: .75rem;
    --danger: 0 84.2% 60.2%;
  }
  .dark {
    --background: 0 0% 13%;
    --foreground: 0 0% 93%;
    --muted-foreground: 0 0% 71%;
    --input: 0 1% 26%;
    /* dark 下的 --destructive 是 0 62.8% 30.6%，当正文颜色太暗，提亮一点 */
    --danger: 0 84% 68%;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 1.5rem;
    background: hsl(var(--background));
    color: hsl(var(--foreground));
    font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  main { width: 100%; max-width: 22rem; }
  h1 { margin: 0; font-size: 1.5rem; font-weight: 700; text-align: center; }
  .hint { margin: 0; font-size: .875rem; color: hsl(var(--muted-foreground)); }
  form { display: flex; flex-direction: column; gap: 1.25rem; margin-top: 1.5rem; }
  .field { display: grid; gap: .5rem; }
  label { font-size: .875rem; font-weight: 500; }
  input {
    height: 2.5rem;
    width: 100%;
    padding: 0 .75rem;
    font: inherit;
    font-size: .875rem;
    color: inherit;
    background: transparent;
    border: 1px solid hsl(var(--input));
    border-radius: calc(var(--radius) - 2px);
    outline: none;
  }
  input:focus-visible { border-color: hsl(var(--ring)); box-shadow: 0 0 0 1px hsl(var(--ring)); }
  button {
    height: 2.5rem;
    width: 100%;
    font: inherit;
    font-size: .875rem;
    font-weight: 500;
    color: hsl(var(--primary-foreground));
    background: hsl(var(--primary));
    border: none;
    border-radius: calc(var(--radius) - 2px);
    cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  .status { margin: 0; min-height: 1.25rem; font-size: .875rem; color: hsl(var(--muted-foreground)); }
  .status.error { color: hsl(var(--danger)); }
  .foot { margin: 0; text-align: center; font-size: .875rem; color: hsl(var(--muted-foreground)); }
  .foot a { color: hsl(var(--primary)); text-underline-offset: 4px; }
</style>
</head>
<body>
<main>
  <h1>注册新账号</h1>
  <p class="hint">注册成功后会自动登录。用户名 2-32 位，只能是字母、数字和 _ . -（首尾须为字母或数字）。</p>

  <form id="form" novalidate>
    <div class="field">
      <label for="username">用户名</label>
      <input id="username" name="username" autocomplete="username" spellcheck="false" maxlength="32" autofocus>
    </div>
    <div class="field">
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="new-password" maxlength="128">
    </div>
    <div class="field">
      <label for="confirm">确认密码</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" maxlength="128">
    </div>
    <button id="submit" type="submit">注册并登录</button>
  </form>

  <!-- 错误与进行中都放这里，读屏靠 aria-live 播报 -->
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <p class="foot"><a id="back" href="/login">已有账号？去登录</a></p>
</main>

<script>
(function () {
  "use strict";

  // 从自己的地址反推部署前缀，天然兼容 CHAINLIT_ROOT_PATH：
  // /cc/public/register.html -> "/cc"，/public/register.html -> ""
  var root = location.pathname.replace(/\/public\/register\.html$/, "");

  // 跟随应用里的主题选择（Chainlit 的 ThemeProvider 用的就是这个 key），
  // 没选过就跟随系统
  var saved = null;
  try { saved = localStorage.getItem("vite-ui-theme"); } catch (e) { /* 隐私模式 */ }
  var dark = saved === "dark" ||
    (saved !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  if (dark) document.documentElement.classList.add("dark");

  var $ = function (id) { return document.getElementById(id); };
  var form = $("form"), submit = $("submit"), status = $("status");
  $("back").href = root + "/login";

  // 与 register.py 的规则一致。这里只为省一次往返，服务端会重新校验。
  var USERNAME_RE = /^[A-Za-z0-9](?:[A-Za-z0-9_.-]{0,30}[A-Za-z0-9])?$/;
  var USERNAME_HINT = "用户名只能是 2-32 位的字母、数字、_ . -，且首尾必须是字母或数字";
  var PASSWORD_HINT = "密码至少 8 位（最多 128 位）";

  function say(text, isError) {
    status.textContent = text;
    status.className = isError ? "status error" : "status";
  }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    var username = $("username").value.trim();
    var password = $("password").value;

    if (!USERNAME_RE.test(username)) return say(USERNAME_HINT, true);
    if (password.length < 8 || password.length > 128) return say(PASSWORD_HINT, true);
    if (password !== $("confirm").value) return say("两次输入的密码不一致", true);

    submit.disabled = true;
    say("正在注册…", false);
    try {
      var res = await fetch(root + "/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: username, password: password })
      });
      if (res.ok) {
        // 会话 cookie 已随响应种下，直接进应用；replace 免得后退回到这张表单
        location.replace(root + "/");
        return;
      }
      var message = "";
      try { message = (await res.json()).error || ""; } catch (e2) { /* 非 JSON 响应 */ }
      if (!message) {
        message = res.status === 409 ? "用户名已被占用"
          : res.status === 422 ? "请求格式不对（页面可能被改过）"
          : "注册失败（HTTP " + res.status + "）";
      }
      say(message, true);
    } catch (e3) {
      say("连不上服务器，请稍后重试", true);
    }
    submit.disabled = false;
  });
})();
</script>
</body>
</html>
